name: SwiftLint

# Enforces Rivulet's own architectural rules only (see .swiftlint.yml — every
# stock rule is off). Runs on Linux via the official container, so no macOS
# runner and no cost on a public repo. Build and archive stay on Codemagic.
on:
  pull_request:
    paths:
      - '**/*.swift'
      - '.swiftlint.yml'
      - '.github/workflows/swiftlint.yml'

concurrency:
  group: swiftlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
