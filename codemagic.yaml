# Codemagic CI/CD configuration for Rivulet (tvOS)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-native-ios-app/
#
# Archives a signed Release build of the Rivulet scheme and uploads to
# TestFlight. Signing files are fetched automatically from App Store Connect.

workflows:
  rivulet-tvos-testflight:
    name: Rivulet tvOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: codemagic

    environment:
      groups:
        - rivulet
      vars:
        XCODE_SCHEME: "Rivulet"
        XCODE_PROJECT: "Rivulet.xcodeproj"
        BUNDLE_ID: "com.gstudios.rivulet"
        APP_STORE_APPLE_ID: 6756892857   # Rivulet's App Store Connect Apple ID
      xcode: latest

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Initialize keychain
        script: keychain initialize

      - name: Provide the distribution certificate private key
        script: |
          # Persist ONE distribution certificate across builds. Regenerating the
          # key every build made `fetch-signing-files --create` mint a NEW cert
          # each run, which eventually hit Apple's distribution-cert cap (HTTP
          # 409 "you already have a current Distribution certificate"). Store a
          # stable PEM key as CERTIFICATE_PRIVATE_KEY (secure env group) so
          # --create binds to it once and REUSES that same cert forever after.
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$CM_BUILD_DIR/cert_key.pem"
            echo "Using persistent CERTIFICATE_PRIVATE_KEY."
          else
            echo "WARNING: CERTIFICATE_PRIVATE_KEY is not set, generating an"
            echo "ephemeral key. This mints a NEW distribution certificate every"
            echo "build and will hit Apple's cert cap. Set CERTIFICATE_PRIVATE_KEY."
            openssl genrsa -out "$CM_BUILD_DIR/cert_key.pem" 2048
          fi

      - name: Fetch or create signing files (tvOS App Store)
        script: |
          # --create generates the distribution certificate (backed by the
          # key above) AND any missing provisioning profiles for the app and
          # its TopShelf extension (com.gstudios.rivulet.*).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type TVOS_APP_STORE \
            --certificate-key @file:"$CM_BUILD_DIR/cert_key.pem" \
            --create
          app-store-connect fetch-signing-files "${BUNDLE_ID}.TopShelfExtension" \
            --platform IOS \
            --type TVOS_APP_STORE \
            --certificate-key @file:"$CM_BUILD_DIR/cert_key.pem" \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply fetched signing profiles to Xcode project
        script: xcode-project use-profiles

      - name: Generate Secrets.swift from env
        script: |
          # Secrets.swift is gitignored (holds the Sentry DSN); recreate it on
          # CI from the SENTRY_DSN env var (group `rivulet`). Falls back to the
          # template's placeholder if unset so the build still compiles.
          cat > Rivulet/Config/Secrets.swift <<EOF
          import Foundation

          enum Secrets {
              static let sentryDSN = "${SENTRY_DSN:-}"
          }
          EOF
          echo "Wrote Rivulet/Config/Secrets.swift (dsn set: $([ -n "${SENTRY_DSN:-}" ] && echo yes || echo no))"

      - name: Set build number from Codemagic counter
        script: |
          # Use App Store Connect's latest TestFlight build number + 1 so we
          # never collide with an existing build. Falls back to PROJECT_BUILD_NUMBER.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then
            NEXT=$(($LATEST + 1))
          else
            NEXT=$PROJECT_BUILD_NUMBER
          fi
          echo "Setting CURRENT_PROJECT_VERSION=$NEXT"
          agvtool new-version -all "$NEXT"

      - name: Build & archive (tvOS Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-flags="-destination 'generic/platform=tvOS'"

      - name: Upload dSYMs to Sentry
        ignore_failure: true
        script: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "No SENTRY_AUTH_TOKEN set, skipping dSYM upload."
            exit 0
          fi
          which sentry-cli >/dev/null 2>&1 || curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli debug-files upload \
            --auth-token "$SENTRY_AUTH_TOKEN" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --include-sources \
            "$CM_BUILD_DIR/build/ios/xcarchive"

    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/xcarchive/*.dSYMs/**/*
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Auto-distribute to the external tester group. Internal testers get
        # every build automatically once it finishes processing, so an internal
        # group must NOT be listed here (App Store Connect rejects assigning a
        # build to an internal group).
        beta_groups:
          - Rivulet External Plex Forum
