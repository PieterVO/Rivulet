# Long-lived Insights worker for Unraid.
#
# Runs the priority loop (see insights/worker.py): drain the on-demand request
# queue every ~INSIGHTS_ONDEMAND_POLL_SECS (high priority), else process ONE
# scheduled title (age-aware TTL refresh -> new airing episodes -> popular),
# re-checking the queue between every title so a live viewer never waits behind
# a scheduled batch. One container = one GPU consumer; a flock in the data dir
# guards against a second instance. Ollama runs elsewhere and is reached over the
# network at INSIGHTS_LLM_BASE_URL (this container does no GPU work itself).
#
#   docker compose up -d --build          # start the worker
#   docker compose logs -f insights-worker
#   docker compose exec insights-worker python -m insights serve   # one manual drain
services:
  insights-worker:
    build: .
    image: insights-pipeline:latest
    container_name: insights-worker
    restart: unless-stopped
    command: ["worker"]          # -> python -m insights worker (ENTRYPOINT is python -m insights)
    env_file: .env
    volumes:
      - ./data:/app/data         # published.jsonl manifest, seed scratch, worker.lock
